<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌟 口算小练习 - 一年级加减法</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #f9f3e6 0%, #f0e6d3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 36px 42px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
            border: 2px solid rgba(255, 215, 150, 0.35);
            transition: all 0.2s;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #f57c3a;
            text-shadow: 3px 3px 0 #fee7c8, 0 4px 12px rgba(245, 124, 58, 0.20);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 span {
            background: #ffedd5;
            padding: 0 16px;
            border-radius: 60px;
            font-size: 1.2rem;
            color: #b45f2a;
            border: 2px dashed #f7b07c;
            line-height: 1.6;
        }

        .header .sub {
            font-size: 1.1rem;
            color: #8b7a66;
            background: #fcf7f0;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            margin-top: 6px;
            border: 1px solid #eddccb;
            letter-spacing: 1px;
        }

        /* ===== 信息输入区 ===== */
        .info-area {
            background: #fcf8f0;
            border-radius: 32px;
            padding: 20px 28px 24px;
            margin-bottom: 28px;
            border: 2px solid #f0dec8;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 24px;
        }

        .info-item {
            flex: 1 0 160px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-item label {
            font-weight: 600;
            font-size: 1.05rem;
            color: #6b5a48;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-item label i {
            font-style: normal;
            font-size: 1.3rem;
        }

        .info-item input {
            padding: 12px 16px;
            border-radius: 40px;
            border: 2px solid #e3d3be;
            font-size: 1.1rem;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
            outline: none;
            width: 100%;
        }

        .info-item input:focus {
            border-color: #f5a06a;
            box-shadow: 0 0 0 4px rgba(245, 160, 106, 0.20);
        }

        .info-item input::placeholder {
            color: #c5b6a2;
            font-size: 0.95rem;
        }

        .btn-start {
            flex: 0 0 auto;
            background: #f5a06a;
            border: none;
            border-radius: 60px;
            padding: 12px 34px;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #c47d4e, 0 6px 18px rgba(245, 160, 106, 0.35);
            font-family: inherit;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            line-height: 1.2;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #c47d4e, 0 10px 28px rgba(245, 160, 106, 0.40);
            background: #f7ae7a;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c47d4e, 0 6px 16px rgba(245, 160, 106, 0.30);
        }

        .btn-start:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #c47d4e;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== 题目区 ===== */
        .questions-area {
            margin: 12px 0 18px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.5s ease, max-height 0.6s ease, margin 0.3s ease;
        }

        .questions-area.show {
            opacity: 1;
            max-height: 3000px;
            margin: 12px 0 18px;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px 18px;
            background: #fbf7ef;
            padding: 22px 24px;
            border-radius: 32px;
            border: 2px solid #ecddcc;
        }

        .question-item {
            background: white;
            border-radius: 20px;
            padding: 12px 14px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 2px solid #efe4d6;
            transition: border-color 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .question-item:hover {
            border-color: #ddcbbc;
        }

        .question-item .q-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #3d3228;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .question-item .q-text .q-num {
            font-size: 0.85rem;
            background: #f0e6d8;
            color: #7a6854;
            padding: 0 12px;
            border-radius: 30px;
            font-weight: 500;
            line-height: 1.8;
        }

        .question-item .q-text .q-body {
            flex: 1;
            text-align: center;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .question-item .q-input {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .question-item .q-input label {
            font-size: 1rem;
            color: #7a6854;
            font-weight: 500;
        }

        .question-item .q-input input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 30px;
            border: 2px solid #dccfc0;
            font-size: 1.2rem;
            text-align: center;
            width: 70px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fcfaf7;
        }

        .question-item .q-input input:focus {
            border-color: #f5a06a;
            box-shadow: 0 0 0 3px rgba(245, 160, 106, 0.20);
        }

        .question-item .q-input input:disabled {
            background: #f3ede6;
            border-color: #d5c6b6;
            color: #5a4e40;
        }

        .question-item .q-result {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            min-height: 2rem;
        }

        .question-item .q-result .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 1rem;
            line-height: 1.8;
        }

        .badge.correct {
            background: #d4edda;
            color: #1e7e34;
            border: 1px solid #b7dfc9;
        }

        .badge.wrong {
            background: #f8dddd;
            color: #a13d3d;
            border: 1px solid #f0c8c8;
        }

        .badge .answer-reveal {
            font-weight: 400;
            color: #6b5a48;
            background: white;
            padding: 0 10px;
            border-radius: 30px;
            border: 1px solid #dccfc0;
        }

        /* ===== 提交 & 操作按钮 ===== */
        .action-area {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin: 12px 0 8px;
        }

        .btn-primary {
            background: #4f9b8a;
            border: none;
            border-radius: 60px;
            padding: 14px 44px;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #2f6f60, 0 6px 18px rgba(79, 155, 138, 0.30);
            font-family: inherit;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            line-height: 1.2;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #2f6f60, 0 10px 28px rgba(79, 155, 138, 0.35);
            background: #58ac9a;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2f6f60;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #2f6f60;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-secondary {
            background: #c9b8a4;
            border: none;
            border-radius: 60px;
            padding: 14px 38px;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #a08d7a, 0 6px 18px rgba(201, 184, 164, 0.30);
            font-family: inherit;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            line-height: 1.2;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #a08d7a, 0 10px 28px rgba(201, 184, 164, 0.35);
            background: #d4c5b3;
        }

        .btn-secondary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a08d7a;
        }

        /* ===== 结果汇总 ===== */
        .summary-area {
            margin-top: 20px;
            padding: 16px 24px 20px;
            border-radius: 32px;
            background: #f7f1e9;
            border: 2px solid #e3d3be;
            text-align: center;
            display: none;
        }

        .summary-area.show {
            display: block;
        }

        .summary-area .score-big {
            font-size: 3.2rem;
            font-weight: 800;
            color: #f57c3a;
            line-height: 1.2;
        }

        .summary-area .score-big small {
            font-size: 1.4rem;
            color: #8b7a66;
            font-weight: 500;
        }

        .summary-area .score-msg {
            font-size: 1.3rem;
            color: #4d3f32;
            margin-top: 4px;
            font-weight: 500;
        }

        .summary-area .score-msg .emoji-big {
            font-size: 2rem;
        }

        /* ===== API 提交状态 ===== */
        .api-status {
            margin-top: 14px;
            padding: 12px 18px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
        }

        .api-status.show {
            display: flex;
        }

        .api-status.success {
            background: #d4edda;
            border-color: #b7dfc9;
            color: #1e7e34;
        }

        .api-status.error {
            background: #f8dddd;
            border-color: #f0c8c8;
            color: #a13d3d;
        }

        .api-status.loading {
            background: #fff3cd;
            border-color: #f5d99b;
            color: #856404;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 700px) {
            .container {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }

            .header h1 {
                font-size: 1.8rem;
                gap: 6px;
            }

            .header h1 span {
                font-size: 0.9rem;
                padding: 0 12px;
            }

            .info-area {
                padding: 16px 18px 18px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .info-item {
                flex: 1 1 auto;
            }

            .btn-start {
                width: 100%;
                justify-content: center;
                padding: 14px;
                font-size: 1.2rem;
            }

            .questions-grid {
                grid-template-columns: 1fr 1fr;
                padding: 16px;
                gap: 12px;
            }

            .question-item .q-text .q-body {
                font-size: 1.2rem;
            }

            .question-item .q-input input {
                font-size: 1rem;
                padding: 6px 8px;
                width: 60px;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 1.1rem;
            }

            .action-area {
                flex-direction: column;
                gap: 12px;
            }

            .summary-area .score-big {
                font-size: 2.4rem;
            }
        }

        @media (max-width: 480px) {
            .questions-grid {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .container {
                padding: 14px 10px 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }

        /* ===== 辅助 ===== */
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-center {
            text-align: center;
        }
        .hidden {
            display: none !important;
        }

        /* ===== 滚动条美化 ===== */
        .questions-grid::-webkit-scrollbar {
            width: 6px;
        }
        .questions-grid::-webkit-scrollbar-track {
            background: #ede5d9;
            border-radius: 10px;
        }
        .questions-grid::-webkit-scrollbar-thumb {
            background: #cdbcab;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <!-- ===== 头部 ===== -->
        <div class="header">
            <h1>
                🧮 口算小练习
                <span>1~50</span>
            </h1>
            <div class="sub">⭐ 一年级 · 加减法 · 每次15道 ⭐</div>
        </div>

        <!-- ===== 信息输入区 ===== -->
        <div class="info-area" id="infoArea">
            <div class="info-item">
                <label><i>👧🧒</i> 姓名</label>
                <input type="text" id="studentName" placeholder="请输入姓名" maxlength="20" />
            </div>
            <div class="info-item">
                <label><i>🏫</i> 班级</label>
                <input type="text" id="className" placeholder="如：一年级1班" maxlength="30" />
            </div>
            <button class="btn-start" id="btnStart">🚀 开始练习</button>
        </div>

        <!-- ===== 题目区 ===== -->
        <div class="questions-area" id="questionsArea">
            <div class="questions-grid" id="questionsGrid"></div>

            <!-- 操作按钮 -->
            <div class="action-area">
                <button class="btn-primary" id="btnSubmit">✅ 提交答案</button>
                <button class="btn-secondary" id="btnReset">🔄 重新出题</button>
            </div>

            <!-- 结果汇总 -->
            <div class="summary-area" id="summaryArea">
                <div class="score-big" id="scoreDisplay">0 <small>/ 15</small></div>
                <div class="score-msg" id="scoreMsg">继续加油哦！💪</div>
            </div>

            <!-- API 提交状态 -->
            <div class="api-status" id="apiStatus"></div>
        </div>

        <!-- 底部留白 -->
        <div style="margin-top: 10px; text-align: center; font-size: 0.85rem; color: #b5a692;">
            ✨ 认真计算，你是最棒的！ ✨
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== DOM 引用 =====
            const studentName = document.getElementById('studentName');
            const className = document.getElementById('className');
            const btnStart = document.getElementById('btnStart');
            const questionsArea = document.getElementById('questionsArea');
            const questionsGrid = document.getElementById('questionsGrid');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnReset = document.getElementById('btnReset');
            const summaryArea = document.getElementById('summaryArea');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const scoreMsg = document.getElementById('scoreMsg');
            const apiStatus = document.getElementById('apiStatus');

            // ===== 状态 =====
            let questions = []; // { id, type, num1, num2, operator, question, correct, userAnswer, isCorrect }
            let isSubmitted = false;
            let isGenerating = false;

            // ===== 工具函数 =====
            function rand(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // 生成一道题 (加法或减法)
            function generateQuestion(index) {
                const isAdd = Math.random() < 0.5;
                let num1, num2, operator, correct;

                if (isAdd) {
                    // 加法：num1 + num2 <= 50, num1 >= 1, num2 >= 1
                    num1 = rand(1, 49);
                    const maxNum2 = 50 - num1;
                    num2 = rand(1, Math.min(maxNum2, 49));
                    operator = '+';
                    correct = num1 + num2;
                } else {
                    // 减法：num1 - num2 >= 0, num1 <= 50, num2 >= 1
                    num1 = rand(1, 50);
                    num2 = rand(1, num1);
                    operator = '−';
                    correct = num1 - num2;
                }

                return {
                    id: index,
                    type: isAdd ? 'add' : 'sub',
                    num1: num1,
                    num2: num2,
                    operator: operator,
                    question: `${num1} ${operator} ${num2} = ?`,
                    correct: correct,
                    userAnswer: null,
                    isCorrect: false,
                };
            }

            // 生成15道题
            function generateQuestions() {
                const qs = [];
                for (let i = 0; i < 15; i++) {
                    qs.push(generateQuestion(i));
                }
                return qs;
            }

            // ===== 渲染题目 =====
            function renderQuestions(qs) {
                questionsGrid.innerHTML = '';
                qs.forEach((q, idx) => {
                    const item = document.createElement('div');
                    item.className = 'question-item';
                    item.dataset.index = idx;

                    const qText = document.createElement('div');
                    qText.className = 'q-text';
                    qText.innerHTML = `
                        <span class="q-num">#${idx + 1}</span>
                        <span class="q-body">${q.question}</span>
                    `;

                    const qInput = document.createElement('div');
                    qInput.className = 'q-input';
                    qInput.innerHTML = `
                        <label>＝</label>
                        <input type="number" id="ans_${idx}" placeholder="?" min="0" max="50" inputmode="numeric" />
                    `;

                    const qResult = document.createElement('div');
                    qResult.className = 'q-result';
                    qResult.id = `result_${idx}`;

                    item.appendChild(qText);
                    item.appendChild(qInput);
                    item.appendChild(qResult);
                    questionsGrid.appendChild(item);

                    // 绑定输入事件
                    const input = qInput.querySelector('input');
                    input.addEventListener('input', function() {
                        if (isSubmitted) return;
                        const val = this.value.trim();
                        if (val === '') {
                            q.userAnswer = null;
                        } else {
                            const num = Number(val);
                            if (!isNaN(num) && Number.isInteger(num)) {
                                q.userAnswer = num;
                            } else {
                                q.userAnswer = null;
                            }
                        }
                    });
                });

                // 存储引用以便后续操作
                window._questionItems = questionsGrid.querySelectorAll('.question-item');
            }

            // ===== 重置所有题目状态（清空答案、结果、禁用状态） =====
            function resetQuestionsState() {
                isSubmitted = false;
                summaryArea.classList.remove('show');
                apiStatus.className = 'api-status';
                apiStatus.style.display = 'none';
                apiStatus.textContent = '';

                const inputs = questionsGrid.querySelectorAll('input[type="number"]');
                inputs.forEach(inp => {
                    inp.value = '';
                    inp.disabled = false;
                    inp.style.borderColor = '#dccfc0';
                });

                const resultDivs = questionsGrid.querySelectorAll('.q-result');
                resultDivs.forEach(div => {
                    div.innerHTML = '';
                });

                questions.forEach(q => {
                    q.userAnswer = null;
                    q.isCorrect = false;
                });

                btnSubmit.disabled = false;
                btnSubmit.textContent = '✅ 提交答案';
            }

            // ===== 批改并显示结果 =====
            function submitAnswers() {
                if (isSubmitted) return;
                if (isGenerating) return;

                // 检查是否所有题目都已作答
                const allAnswered = questions.every(q => q.userAnswer !== null && q.userAnswer !== undefined);
                if (!allAnswered) {
                    // 找出未作答的题目
                    const emptyIndices = questions
                        .map((q, i) => (q.userAnswer === null || q.userAnswer === undefined) ? i + 1 : null)
                        .filter(v => v !== null);
                    const msg = `还有 ${emptyIndices.length} 道题没有填写答案哦！\n请完成第 ${emptyIndices.join('、')} 题。`;
                    alert(msg);
                    // 高亮未填的输入框
                    questions.forEach((q, idx) => {
                        const input = document.getElementById(`ans_${idx}`);
                        if (input && (q.userAnswer === null || q.userAnswer === undefined)) {
                            input.style.borderColor = '#e67e7e';
                            input.focus();
                        }
                    });
                    return;
                }

                // 批改
                let correctCount = 0;
                questions.forEach((q, idx) => {
                    const isRight = q.userAnswer === q.correct;
                    q.isCorrect = isRight;
                    if (isRight) correctCount++;

                    const resultDiv = document.getElementById(`result_${idx}`);
                    const badge = document.createElement('span');
                    badge.className = `badge ${isRight ? 'correct' : 'wrong'}`;
                    if (isRight) {
                        badge.innerHTML = '✅ 正确';
                    } else {
                        badge.innerHTML = `❌ 正确答案：<span class="answer-reveal">${q.correct}</span>`;
                    }
                    resultDiv.innerHTML = '';
                    resultDiv.appendChild(badge);

                    // 禁用输入框
                    const input = document.getElementById(`ans_${idx}`);
                    if (input) {
                        input.disabled = true;
                        if (!isRight) {
                            input.style.borderColor = '#e67e7e';
                        } else {
                            input.style.borderColor = '#5cb85c';
                        }
                    }
                });

                isSubmitted = true;
                btnSubmit.disabled = true;
                btnSubmit.textContent = '📊 已批改';

                // 显示汇总
                const score = correctCount;
                scoreDisplay.innerHTML = `${score} <small>/ 15</small>`;

                let msg = '';
                let emoji = '';
                if (score === 15) {
                    msg = '🎉 太棒了！全部答对，你是口算小天才！ 🌟';
                    emoji = '🏆';
                } else if (score >= 13) {
                    msg = '👏 非常优秀！再接再厉，争取满分！ 💪';
                    emoji = '🌟';
                } else if (score >= 10) {
                    msg = '😊 表现不错！多练习一下，你会更棒的！ 📚';
                    emoji = '👍';
                } else if (score >= 7) {
                    msg = '🤔 还需要多加练习哦！每天进步一点点！ 💪';
                    emoji = '📝';
                } else {
                    msg = '🧐 别灰心！认真检查，再练一次吧！ 🌈';
                    emoji = '❤️';
                }
                scoreMsg.innerHTML = `${emoji} ${msg}`;
                summaryArea.classList.add('show');

                // 提交数据到 API
                sendDataToAPI(score);
            }

            // ===== 发送数据到 API =====
            function sendDataToAPI(score) {
                const name = studentName.value.trim() || '未填写';
                const cls = className.value.trim() || '未填写';

                const payload = {
                    studentName: name,
                    className: cls,
                    questions: questions.map(q => ({
                        question: q.question,
                        correctAnswer: q.correct,
                        userAnswer: q.userAnswer,
                        isCorrect: q.isCorrect,
                    })),
                    score: score,
                    total: 15,
                    timestamp: new Date().toISOString(),
                };

                // 显示加载状态
                apiStatus.className = 'api-status show loading';
                apiStatus.style.display = 'flex';
                apiStatus.innerHTML = '⏳ 正在提交数据...';

                fetch('https://quickform.cn/api/qgqyexueft', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                    })
                    .then(async (response) => {
                        let text = await response.text();
                        let data = null;
                        try {
                            data = JSON.parse(text);
                        } catch (_) { /* 忽略解析错误 */ }

                        if (response.ok) {
                            apiStatus.className = 'api-status show success';
                            apiStatus.style.display = 'flex';
                            apiStatus.innerHTML = '✅ 数据已成功提交！ 谢谢你的练习 🎉';
                        } else {
                            throw new Error(`服务器响应异常 (${response.status})`);
                        }
                    })
                    .catch((error) => {
                        console.error('API 提交失败:', error);
                        apiStatus.className = 'api-status show error';
                        apiStatus.style.display = 'flex';
                        apiStatus.innerHTML = '⚠️ 数据提交失败，但你的练习成绩已经记录啦！ 请稍后重试。';
                    });
            }

            // ===== 开始练习 =====
            function startPractice() {
                // 校验姓名和班级
                const name = studentName.value.trim();
                const cls = className.value.trim();
                if (!name) {
                    alert('✏️ 请先输入你的姓名哦！');
                    studentName.focus();
                    return;
                }
                if (!cls) {
                    alert('🏫 请先输入你的班级哦！');
                    className.focus();
                    return;
                }

                if (isGenerating) return;
                isGenerating = true;
                btnStart.disabled = true;
                btnStart.textContent = '⏳ 生成中...';

                // 清空旧状态
                questions = generateQuestions();
                renderQuestions(questions);
                resetQuestionsState();

                // 显示题目区
                questionsArea.classList.add('show');

                // 滚动到题目区
                setTimeout(() => {
                    questionsArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);

                // 聚焦到第一题
                setTimeout(() => {
                    const firstInput = document.getElementById('ans_0');
                    if (firstInput) firstInput.focus();
                }, 400);

                isGenerating = false;
                btnStart.disabled = false;
                btnStart.textContent = '🚀 重新开始';
            }

            // ===== 重新出题（保留姓名班级） =====
            function resetPractice() {
                if (isGenerating) return;
                // 如果已经提交了，直接重新生成
                startPractice();
            }

            // ===== 事件绑定 =====
            btnStart.addEventListener('click', startPractice);
            btnSubmit.addEventListener('click', submitAnswers);
            btnReset.addEventListener('click', resetPractice);

            // 回车键快速开始
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    const active = document.activeElement;
                    if (active === studentName || active === className) {
                        e.preventDefault();
                        btnStart.click();
                    }
                }
            });

            // ===== 初始化：让页面就绪 =====
            // 预生成一组题目（但不显示），让用户点击开始后快速呈现
            questions = generateQuestions();
            renderQuestions(questions);
            resetQuestionsState();
            // 默认隐藏题目区
            questionsArea.classList.remove('show');

            console.log('🧮 口算小练习已加载！');
            console.log('📝 输入姓名和班级，点击 "开始练习" 吧！');

        })();
    </script>
